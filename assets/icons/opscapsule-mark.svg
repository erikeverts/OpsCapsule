<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">OpsCapsule brand mark</title>
  <desc id="description">A terminal prompt and cursor surrounded by two open capsule rings.</desc>
  <defs>
    <linearGradient id="outerRing" x1="9" y1="10" x2="55" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2ce9ec" />
      <stop offset="0.52" stop-color="#56f2f2" />
      <stop offset="1" stop-color="#2bdfe5" />
    </linearGradient>
    <linearGradient id="innerRing" x1="17" y1="17" x2="47" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3bcbc6" />
      <stop offset="1" stop-color="#3ec8c5" />
    </linearGradient>
    <linearGradient id="prompt" x1="24" y1="24" x2="43" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#f4f1e9" />
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round">
    <path d="M 28.5 7.5 C 15.8 9 7.5 19.4 7.5 32 C 7.5 44.6 15.8 55 28.5 56.5" stroke="url(#outerRing)" stroke-width="4.8" />
    <path d="M 35.5 7.5 C 48.2 9 56.5 19.4 56.5 32 C 56.5 44.6 48.2 55 35.5 56.5" stroke="url(#outerRing)" stroke-width="4.8" />
    <path d="M 28.5 15.5 C 20.2 16.8 14.5 23.5 14.5 32 C 14.5 40.5 20.2 47.2 28.5 48.5" stroke="url(#innerRing)" stroke-width="4" />
    <path d="M 35.5 15.5 C 43.8 16.8 49.5 23.5 49.5 32 C 49.5 40.5 43.8 47.2 35.5 48.5" stroke="url(#innerRing)" stroke-width="4" />
  </g>

  <path d="M 26 25 L 34.5 32 L 26 39" fill="none" stroke="url(#prompt)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="39" y="36.5" width="5" height="5" rx="0.8" fill="url(#prompt)" />
</svg>
