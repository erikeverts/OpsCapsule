name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux ${{ matrix.architecture }} build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      # The sandbox acceptance tests need ripgrep, and enforced isolation on
      # Linux needs bwrap and socat at runtime. Installing them here keeps the
      # build host honest about what a user will need.
      - name: Install isolation runtime dependencies
        run: |
          sudo apt-get update
          # fakeroot and dpkg build the package; the rest are what a capsule
          # needs at runtime and are installed so the tests exercise them.
          sudo apt-get install -y ripgrep bubblewrap socat fakeroot dpkg

      # Native modules are rebuilt for Electron's ABI, so this cannot be
      # cross-built from another platform.
      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run automated tests
        run: npm test

      - name: Build distributables
        id: artifacts
        shell: bash
        run: |
          npm run make
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Named like the macOS artifact, minus the signing suffix: nothing here
      # is signed, and implying otherwise would be worse than saying nothing.
      - name: Retain workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opscapsule-${{ steps.artifacts.outputs.version }}-linux-${{ matrix.architecture }}
          path: |
            out/make/**/*.zip
            out/make/**/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Electron links against system libraries that a minimal installation
      # does not have, which surfaces as "cannot open shared object file" on
      # first run. The runner image is not minimal, so the package is checked
      # against one that is.
      - name: Verify the package declares every library it needs
        if: matrix.architecture == 'x64'
        shell: bash
        run: |
          package="$(find out/make -name '*.deb' -print -quit)"
          docker run --rm -v "${PWD}:/work" -w /work ubuntu:24.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./'"${package}"' >/dev/null
            # Resolve through the command the package installs rather than
            # assuming where it put the files.
            binary="$(readlink -f "$(command -v opscapsule)")"
            echo "installed binary: ${binary}"
            missing="$(ldd "${binary}" 2>/dev/null | grep "not found" || true)"
            if [ -n "${missing}" ]; then
              echo "Missing libraries after install:"; echo "${missing}"; exit 1
            fi
            echo "every linked library resolves after apt install"
            # Installing the package must be enough to launch a capsule, not
            # just enough to start the window.
            for tool in bwrap socat rg curl; do
              command -v "${tool}" >/dev/null || { echo "missing ${tool}"; exit 1; }
            done
            echo "isolation and broker tools present after apt install"
          '

      - name: Verify the build matches the runner
        shell: bash
        run: |
          # A native module built for the wrong architecture produces a package
          # that only fails when a terminal is opened, so it is checked here.
          binary="$(find out/make -name '*.zip' -print -quit)"
          echo "built ${binary}"
          unzip -o -q "${binary}" -d /tmp/verify
          file /tmp/verify/*/OpsCapsule | tee /tmp/arch.txt
          case "${{ matrix.architecture }}" in
            x64) grep -q "x86-64" /tmp/arch.txt ;;
            arm64) grep -qE "aarch64|ARM aarch64" /tmp/arch.txt ;;
          esac

  macos-arm64:
    name: macOS arm64 prerelease
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify release host
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" || "$(node -p process.arch)" != "arm64" ]]; then
            echo "The macOS release job must run natively on arm64." >&2
            exit 1
          fi
          node --version

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          npm run verify:release-tag -- "${GITHUB_REF_NAME}"
          release_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          fi

      # The release job only runs for repository tags or an explicit manual
      # dispatch on an ephemeral runner. Native dependencies require their
      # locked install scripts in order to build for Electron's ABI.
      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Enforced macOS isolation requires ripgrep at runtime, and the sandbox
      # acceptance test skips itself when it is absent. Installing it here
      # keeps the isolation guarantee genuinely exercised before a release is
      # produced rather than silently unverified.
      - name: Install isolation runtime dependencies
        run: brew install ripgrep

      - name: Run automated tests
        run: npm test

      - name: Build distributables
        run: npm run make

      - name: Verify packaged application
        run: npm run verify:package

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          npm run prepare:release
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify distributable containers
        shell: bash
        run: |
          (cd release && shasum -a 256 -c SHA256SUMS.txt)
          hdiutil verify release/*.dmg
          unzip -tqq release/*.zip

      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Retain workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opscapsule-${{ steps.artifacts.outputs.version }}-macos-arm64-ad-hoc
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --verify-tag \
            --prerelease \
            --latest=false \
            --generate-notes \
            --title "OpsCapsule ${GITHUB_REF_NAME} (ad-hoc-signed macOS preview)" \
            --notes "$(cat .github/release-notes/unsigned-macos.md)"
