name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      # Lifecycle scripts are the primary execution vector in npm
      # supply-chain compromises, so they are disabled in CI. Nothing in the
      # build or test path needs them: node-pty is marked external by esbuild
      # and is never imported by the test suite, and Electron itself is not
      # launched here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and type-check
        run: npm run build

      - name: Run tests
        run: npm test
