version: 2

updates:
  # npm dependencies. Cooldown windows give the ecosystem time to detect and
  # yank compromised releases (the npm supply-chain attacks of recent years
  # were typically caught and unpublished within hours to a few days).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
    ignore:
      # Electron owns the runtime Node version. Move @types/node to a new
      # major only when Electron moves to that Node major as part of a
      # deliberate runtime upgrade; keep receiving minor and patch updates.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope

  # GitHub Actions used by CI. Pin-by-SHA is still recommended; Dependabot
  # keeps the SHAs current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
